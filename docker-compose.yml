services:
  botchecker:
    build: .
    image: botchecker:latest
    container_name: botchecker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/botchecker.db
      APP_PORT: "8081"
    ports:
      - "${HOST_PORT:-8081}:8081"
    volumes:
      - botchecker-data:/data

volumes:
  botchecker-data:
